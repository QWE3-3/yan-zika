name: Deploy zip to Pages
on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Download zip from release
        run: |
          gh release download --pattern "*.zip" --dir download
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Unzip
        run: |
          mkdir -p site
          unzip -o download/*.zip -d site

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
